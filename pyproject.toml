[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "graphnexus-core"
version = "0.5.0"
description = "Agnostic framework transforming tabular datasets into interactive 3D graphs with Louvain community detection."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "networkx>=3.2",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "leidenalg>=0.10",
]

[project.scripts]
graphnexus = "graphnexus.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0", "mypy>=1.5.0"]
