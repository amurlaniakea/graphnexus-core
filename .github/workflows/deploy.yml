name: CI
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - run: pytest tests/ -v
    - run: python -m py_compile src/graphnexus/main.py src/graphnexus/engine.py src/graphnexus/pipeline.py
